# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../specs/openapi_corrected.yaml
      overrides: ./verify-overlay.yml

default-group: go-sdk

groups:
  go-sdk:
    generators:
      - name: fern-go-sdk
        version: 1.57.2
        output:
          location: local-file-system
          path: ../generated
        config:
          module:
            path: github.com/ChrisVerde02/ibmverify-go/generated
          packageName: generated
